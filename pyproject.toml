[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agent-collaboration-runtime"
version = "0.1.0"
description = "Local durable collaboration runtime vertical slice"
requires-python = ">=3.12"
dependencies = [
  "mcp==2.2.0",
  "mcp-types==2.2.0",
  "cryptography==50.0.1",
  "PyNaCl==1.6.2",
  "fastapi>=0.115,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "temporalio>=1.15,<2",
  "typer>=0.15,<1",
  "uvicorn>=0.34,<1",
]

[project.scripts]
acs-runtime = "runtime.surface_entry:main"
acs-receiver = "runtime.receiver_entry:main"
acs-receiver-provision = "runtime.receiver_provision:main"

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["runtime", "runtime_deployment"]

[tool.pytest.ini_options]
testpaths = ["runtime_tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
extend-select = ["B", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["runtime", "runtime_tests"]

[tool.ruff.lint.per-file-ignores]
"runtime_tests/*" = ["S101"]

[tool.basedpyright]
typeCheckingMode = "basic"
include = ["runtime"]
venvPath = "."
venv = ".venv"
