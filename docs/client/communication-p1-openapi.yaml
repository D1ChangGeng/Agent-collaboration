components:
  securitySchemes:
    trustedBearer:
      type: http
      scheme: bearer
      description: Use the existing trusted actor resolver; no sender/role claims
        from request body.
  schemas:
    Actor:
      type: object
      additionalProperties: false
      properties:
        address:
          type: string
          minLength: 1
          maxLength: 512
        principal_ref:
          type: string
          minLength: 1
          maxLength: 512
        level:
          type: string
          enum:
          - client
          - root
          - route
          - agent
        agent_slot_id:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 512
          - type: 'null'
        auth_revision:
          type: string
          minLength: 1
          maxLength: 512
        allowed_actions:
          type: array
          items:
            type: string
      required:
      - address
      - principal_ref
      - level
      - agent_slot_id
      - auth_revision
      - allowed_actions
    PageInfo:
      type: object
      additionalProperties: false
      properties:
        next_cursor:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 2048
          - type: 'null'
        snapshot_id:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 512
          - type: 'null'
      required:
      - next_cursor
      - snapshot_id
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
        retryable:
          type: boolean
        effect_state:
          type: string
          enum:
          - none
          - committed
          - native_possible
          - unknown
        operation_ref:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 512
          - type: 'null'
        details:
          type: object
      required:
      - code
      - message
      - retryable
      - effect_state
    Problem:
      type: object
      additionalProperties: false
      properties:
        error:
          $ref: '#/components/schemas/Error'
        request_id:
          type: string
          minLength: 1
          maxLength: 512
      required:
      - error
      - request_id
    Meta:
      type: object
      additionalProperties: false
      properties:
        schema_version:
          type: string
          enum:
          - acs-client/1
        server_version:
          type: string
        authority_id:
          type: string
          minLength: 1
          maxLength: 512
        authority_incarnation:
          type: string
          minLength: 1
          maxLength: 512
        features:
          type: array
          items:
            type: string
        limits:
          type: object
          additionalProperties: false
          properties:
            message_bytes:
              type: integer
              minimum: 1
            page_items:
              type: integer
              minimum: 1
            attachment_bytes:
              type: integer
              minimum: 1
            attachment_count:
              type: integer
              minimum: 0
            attachment_total_bytes:
              type: integer
              minimum: 0
            attachment_staging_bytes:
              type: integer
              minimum: 0
            attachment_project_staging_bytes:
              type: integer
              minimum: 0
            attachment_staging_seconds:
              type: integer
              minimum: 0
            event_replay_seconds:
              type: integer
              minimum: 0
            native_link_count:
              type: integer
              minimum: 0
            native_link_history_revisions:
              type: integer
              minimum: 0
            native_link_write_receipts:
              type: integer
              minimum: 0
            native_link_metadata_bytes:
              type: integer
              minimum: 0
          required:
          - message_bytes
          - page_items
          - attachment_bytes
          - attachment_count
          - attachment_total_bytes
          - attachment_staging_bytes
          - attachment_project_staging_bytes
          - attachment_staging_seconds
