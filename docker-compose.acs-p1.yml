name: acs-p1

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: acs
      POSTGRES_PASSWORD: acs-local-only
      POSTGRES_DB: temporal
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - acs-p1-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acs -d temporal"]
      interval: 5s
      timeout: 5s
      retries: 20

  temporal:
    image: temporalio/auto-setup:1.29.1
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: acs
      POSTGRES_PWD: acs-local-only
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/docker.yaml
    ports:
      - "127.0.0.1:7239:7233"
    healthcheck:
      test: ["CMD-SHELL", "temporal operator cluster health --address $$(hostname -i):7233"]
      interval: 10s
      timeout: 10s
      retries: 30

volumes:
  acs-p1-postgres:
