name: Validate ACS

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ${{ matrix.python-version == '3.9' && 'ubuntu-22.04' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate Skill
        run: python scripts/validate_skill.py
      - name: Install test runner
        run: python -m pip install 'pytest>=8.3,<9'
      - name: Run tests
        run: python -m unittest discover -s tests -v

  runtime:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: acs_clock
          POSTGRES_PASSWORD: acs_clock_ci
          POSTGRES_DB: acs_communication_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U acs_clock -d acs_communication_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.9"
      - name: Install locked Runtime
        run: uv sync --frozen --group dev
      - name: Check release tooling
        run: uv run --frozen ruff check scripts/acs_bootstrap.py scripts/acs_update.py scripts/acs_launcher.py scripts/acs_startup.py scripts/acs_doctor.py scripts/acs_install.py scripts/acs_web_setup.py scripts/acs_source_discovery.py scripts/build_release.py scripts/release_preflight.py tests/test_release_tools.py tests/test_machine_install.py tests/test_web_setup.py tests/test_source_discovery.py tests/test_automatic_updates.py tests/test_update_launcher.py tests/test_startup_recovery.py
      - name: Runtime component tests
        run: uv run --frozen pytest runtime_tests -q
      - name: Communication and Authority PostgreSQL integration
        env:
          ACS_P1_DSN: postgresql://acs_clock:acs_clock_ci@127.0.0.1:5432/acs_communication_test
          ACS_COMMUNICATION_TEST_DSN: postgresql://acs_clock:acs_clock_ci@127.0.0.1:5432/acs_communication_test
        run: >-
          uv run --frozen pytest -q -rs -o addopts=''
          runtime_tests/test_authority_clock.py
          runtime_tests/test_domain_ledger.py
          runtime_tests/test_lease_authority.py
          runtime_tests/test_receiver_domain_delivery.py
          runtime_tests/test_domain_evidence.py
          runtime_tests/test_recovery_postgres.py
          runtime_tests/test_communication.py
          runtime_tests/test_communication_input_guidance.py
          runtime_tests/test_communication_content.py
          runtime_tests/test_communication_configuration.py
          runtime_tests/test_communication_restart.py
          runtime_tests/test_communication_adapters.py
          runtime_tests/test_communication_faults.py
          runtime_tests/test_communication_maintenance.py
          runtime_tests/test_communication_archive.py
          runtime_tests/test_communication_retirement.py
          runtime_tests/test_communication_storage.py
          runtime_tests/test_current_project_files_pg.py
          runtime_tests/test_communication_signed_receiver.py
          runtime_tests/test_communication_receiver.py
          runtime_tests/test_receiver_opencode_factory.py
          runtime_tests/test_send_wait_semantics.py
          runtime_tests/test_project_http.py
          runtime_tests/test_owner_enrollment_pg.py
          runtime_tests/test_machine_filesystem_pg.py
      - name: Gate tooling tests
        run: uv run --frozen python -m unittest discover -s tools/runtime/tests -q

  package:
    runs-on: ubuntu-latest
    needs: [validate, runtime]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.9"
      - name: Build Runtime wheel
        run: uv build --wheel
      - name: Assemble candidate distribution
        run: python scripts/build_release.py --output dist/release --version 2.0.3
