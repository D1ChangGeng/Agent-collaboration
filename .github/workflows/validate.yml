name: Validate ACS

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate Skill
        run: python scripts/validate_skill.py
      - name: Install test runner
        run: python -m pip install 'pytest>=8.3,<9'
      - name: Run tests
        run: python -m unittest discover -s tests -v

  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.9"
      - name: Install locked Runtime
        run: uv sync --frozen --group dev
      - name: Check release tooling
        run: uv run --frozen ruff check scripts/acs_bootstrap.py scripts/acs_doctor.py scripts/acs_install.py scripts/acs_web_setup.py scripts/acs_source_discovery.py scripts/build_release.py scripts/release_preflight.py tests/test_release_tools.py tests/test_machine_install.py tests/test_web_setup.py tests/test_source_discovery.py
      - name: Runtime component tests
        run: uv run --frozen pytest runtime_tests -q
      - name: Gate tooling tests
        run: uv run --frozen python -m unittest discover -s tools/runtime/tests -q

  package:
    runs-on: ubuntu-latest
    needs: [validate, runtime]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.9"
      - name: Build Runtime wheel
        run: uv build --wheel
      - name: Assemble candidate distribution
        run: python scripts/build_release.py --output dist/release --version 1.2.0
